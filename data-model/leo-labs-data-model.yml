core_graph_summary: CatalogObject is the hub. It has many States (each State carries per-frame
  position/velocity/covariance, yields TLEs, and can be propagated into an ephemeris) and many
  Measurements. Measurements are produced by Instruments, optionally under a Task. Tasks can be
  created either object-first (prioritise this object) or instrument-first (use this radar over
  this window), and their measurements are retrievable per task.
