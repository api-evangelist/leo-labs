aid: leo-labs
name: LeoLabs
description: 'LeoLabs is a commercial space situational awareness company that operates
  a global network of phased-array radars and a cloud analytics platform delivering
  what it calls Persistent Orbital Intelligence for low Earth orbit. It independently
  tracks more than 23,000 objects in LEO and turns those radar observations into a
  commercial catalog, orbital state vectors, conjunction alerts, maneuver detection,
  pattern-of-life analysis and launch support for satellite operators, insurers, defense
  and civil space agencies. Customers reach the data either through the LeoLabs Platform
  web interface or, as LeoLabs describes it, "a suite of full-featured RESTful APIs
  for ground system integration and automation at scale" — the v1 Platform API over
  the catalog, radar measurements, state vectors, TLEs, ephemeris propagation and radar
  tasking. The company is backed by Insight Partners.'
